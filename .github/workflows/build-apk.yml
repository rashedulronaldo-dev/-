name: Build Android APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -noprompt -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK for Release
        run: cp app/build/outputs/apk/debug/app-debug.apk madrasa-app.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: madrasa-app-apk
          path: madrasa-app.apk

      - name: Create or Update Latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Madrasa Management App (Latest APK)"
          body: "Automated APK build for খেলার মাঠ নূরানী তালিমুল কুরআন ও হাফিজিয়া মাদরাসা."
          files: madrasa-app.apk
          prerelease: false
          overwrite_files: true
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
